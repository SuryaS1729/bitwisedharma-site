    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "ProfessionalService",
            "name": "The BitwiseDharma Company",
            "description": "An independent software studio in Hyderabad. We design and build web and mobile products for teams that need fewer handoffs and more working software.",
            "email": "bitwisedharma@gmail.com",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Hyderabad",
              "addressRegion": "Telangana",
              "addressCountry": "IN"
            },
            "areaServed": "Worldwide",
            "knowsAbout": [
              "Product design",
              "Web applications",
              "Mobile applications",
              "Design systems"
            ]
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "What kinds of products do you build?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Web apps, mobile apps, customer portals, and internal tools. Most of our work starts as a rough idea or a product that has outgrown its first version."
                }
              },
              {
                "@type": "Question",
                "name": "How do projects start?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "With a thirty minute call. You describe the problem, we ask questions, and then we send a short written scope with milestones and a price for the first build."
                }
              },
              {
                "@type": "Question",
                "name": "How much does a project cost?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "We price by scope, not by the hour. After the first call you get a fixed price for the first milestone, so you know the number before any work begins."
                }
              },
              {
                "@type": "Question",
                "name": "Who will I work with?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "The same two to four people from the first call to the final handover. There is no account layer between you and the build."
                }
              },
              {
                "@type": "Question",
                "name": "Do you work with teams outside India?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. We are based in Hyderabad and work remotely with teams in other time zones. We agree on a shared overlap window before we start."
                }
              },
              {
                "@type": "Question",
                "name": "Do we own the work?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. Code, design files, and documentation are yours. We transfer everything as we go, not at the end."
                }
              },
              {
                "@type": "Question",
                "name": "What happens after launch?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "You can take a clean handover or keep us on a monthly support arrangement. Either way, you are not locked in."
                }
              },
              {
                "@type": "Question",
                "name": "Can you work with our existing team?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Yes. We can join your repository and rituals, or own a workstream end to end. We will tell you honestly which one fits."
                }
              }
            ]
          }
        ]
      }
    </script>
